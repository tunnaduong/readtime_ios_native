name: Android debug APK

# Builds the Android debug APK via Skip and publishes it two ways:
# 1. As a normal workflow artifact (Actions tab → this run → Artifacts).
# 2. Committed into the `prerelease-android` branch, so there's always a
#    stable link to the latest debug build without digging through run history.
#
# Iterated directly against real GitHub Actions runs (no local macOS/Android
# toolchain available while developing this). `swift build` (plain host
# compile) now succeeds outright — that caught every source-level bridging/
# syntax issue. The actual Android artifact comes from `skip android build`
# (Skip Fuse's real cross-compile command, via the Swift Android SDK
# installed by `skip android sdk install`) — replaced an earlier, wrong
# assumption that `swift build` alone generates a Gradle project under
# Android/ that a plain `./gradlew`/`skip gradle` could assemble; per Skip's
# docs, `skip android build` runs fully headless, no emulator needed. Its
# exact output layout (a raw binary vs. something Gradle-packageable into an
# .apk) is not yet confirmed by an actual run. See README.md's "Android
# (Skip)" section for what's still stubbed (ads, photo picker, purchases
# need real keys) before this produces a fully working app.

on:
  push:
    branches: [dhphuc, main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-debug-apk:
    # Skip's own toolchain (the Swift-for-Android SDK, invoked through Xcode)
    # only runs on macOS. skip-bridge (a skip-fuse dependency) uses
    # `@isolated(any)` closure syntax, which needs a Swift 6.1-era compiler —
    # macos-14's default Xcode (15.x, Swift 5.9/5.10) fails with "attribute
    # can only be applied to declarations, not types". macos-15 ships Xcode 16.x.
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest available Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Skip CLI
        run: brew install skiptools/skip/skip

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        # android-actions/setup-android's default package list includes the
        # legacy "tools" package, which Google has removed from the SDK
        # repository — that fails with "Failed to find package 'tools'" on
        # current runners. Install only what's actually needed instead.
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Skip doctor (sanity-check the toolchain)
        run: skip --version && skip doctor || true

      # Sanity build: plain host compile of the Swift package (SwiftUI
      # transpilation, Skip's bridging checks, ordinary Swift type-checking).
      # Fails fast on source problems before spending time on the Android
      # cross-compile below.
      - name: Build Swift package (sanity check)
        run: swift build --product ReadTime

      # Homebrew refuses to load a Cask from a third-party tap ("untrusted
      # tap") without this, even though the tap itself (skiptools/skip) is
      # already tapped via the `skip` formula install above.
      - name: Trust the skiptools Homebrew tap for its Casks
        run: brew trust skiptools/skip

      # The Swift Android SDK (a cross-compilation toolchain, separate from
      # the Xcode/host Swift toolchain) that `skip android build` needs.
      # Pinned explicitly: auto-resolving "latest" picked 6.4.0, which
      # doesn't exist. It installs via a Homebrew Cask from skiptools'
      # own tap (skiptools/homebrew-skip); "6.1.0" isn't a valid cask
      # version there — checked the tap directly, versions are named
      # like `6.1`/`6.2.3`, not `6.1.0`. Using 6.2.3, the newest listed.
      - name: Install the Swift Android SDK
        run: |
          mkdir -p "$HOME/.swiftpm/swift-sdks"
          chmod -R u+rwX "$HOME/.swiftpm"
          skip android sdk install --version 6.2.3 || {
            echo "::group::skip-install log"
            cat /tmp/skip-install-*.txt 2>/dev/null || echo "(no log file found)"
            echo "::endgroup::"
            exit 1
          }

      # Skip Fuse's real Android artifact: cross-compiles this same Swift
      # source natively for Android via the SDK above. Headless — no
      # emulator/device needed.
      - name: Build for Android
        run: skip android build --configuration debug --dir build-output

      - name: Locate the built APK
        id: apk
        run: |
          apk_path=$(find build-output Android -type f -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$apk_path" ]; then
            echo "No .apk found under build-output/ or Android/ — inspecting what 'skip android build' actually produced:" >&2
            find build-output Android -type f 2>/dev/null >&2 || true
            exit 1
          fi
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: readtime-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish APK to the prerelease-android branch
        env:
          APK_SOURCE: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/prerelease-worktree
          git fetch origin prerelease-android || true
          if git ls-remote --exit-code --heads origin prerelease-android >/dev/null 2>&1; then
            git worktree add /tmp/prerelease-worktree origin/prerelease-android -B prerelease-android
          else
            git worktree add --detach /tmp/prerelease-worktree
            (cd /tmp/prerelease-worktree && git checkout --orphan prerelease-android && git rm -rf . >/dev/null 2>&1 || true)
          fi

          mkdir -p /tmp/prerelease-worktree/prerelease
          cp "$APK_SOURCE" /tmp/prerelease-worktree/prerelease/ReadTime-debug.apk

          cat > /tmp/prerelease-worktree/prerelease/README.md <<EOF
          # ReadTime — Android prerelease debug APK

          Rebuilt automatically by \`.github/workflows/android-debug-apk.yml\`
          on every push to \`dhphuc\`/\`main\` (and manual dispatch).

          - Source commit: ${{ github.sha }}
          - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Built: $(date -u +"%Y-%m-%dT%H:%M:%SZ")

          This is a **debug** build — unsigned for release, ads/purchases/photo
          picker are still stubbed on Android (see the main README). Install
          with:

          \`\`\`sh
          adb install -r ReadTime-debug.apk
          \`\`\`
          EOF

          cd /tmp/prerelease-worktree
          git add prerelease/ReadTime-debug.apk prerelease/README.md
          if git diff --cached --quiet; then
            echo "No changes to the APK; skipping commit."
          else
            git commit -m "Prerelease Android debug APK from ${{ github.sha }}"
            git push origin prerelease-android
          fi
